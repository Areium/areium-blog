# Separate port keeps the existing Cloudreve website on port 80 intact.
server {
    listen 18080;
    server_name 120.53.103.157;
    server_tokens off;
    client_max_body_size 6m;

    location / {
        # Do not inherit BaoTa's global proxy cache for HTML or authenticated APIs.
        proxy_cache off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /www/wwwlogs/areium-blog.log;
    error_log /www/wwwlogs/areium-blog.error.log;
}
